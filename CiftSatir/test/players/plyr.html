<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Plyr player</title>
  <link rel="stylesheet" href="/vendor/plyr.css" />
  <style>
    body { margin: 0; background: #111; }
    .wrap { padding: 80px 40px; width: 640px; }
    video { width: 640px; height: 360px; }
  </style>
</head>
<body>
  <div class="wrap">
    <video id="v" playsinline muted preload="auto" controls>
      <source src="/vendor/flower.mp4" type="video/mp4" />
      <track kind="subtitles" srclang="en" label="English" src="/sample.vtt" default />
    </video>
  </div>
  <script src="/vendor/plyr.min.js"></script>
  <script>
    window.player = new Plyr('#v', { captions: { active: true, update: true } });
  </script>
</body>
</html>
