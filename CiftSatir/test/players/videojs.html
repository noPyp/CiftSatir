<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Video.js player</title>
  <link rel="stylesheet" href="/vendor/video-js.min.css" />
  <style>
    body { margin: 0; background: #111; }
    .wrap { padding: 80px 40px; }
    .video-js { width: 640px; height: 360px; }
  </style>
</head>
<body>
  <div class="wrap">
    <video id="v" class="video-js vjs-default-skin" controls playsinline muted preload="auto">
      <source src="/vendor/flower.mp4" type="video/mp4" />
      <track id="t" kind="subtitles" srclang="en" label="English" src="/sample.vtt" default />
    </video>
  </div>
  <script src="/vendor/video.min.js"></script>
  <script>
    window.player = videojs('v', { controls: true, fluid: false });
  </script>
</body>
</html>
