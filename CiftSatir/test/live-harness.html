<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ÇiftSatır canlı test</title>
    <style>
      body { margin: 0; background: #000; }
      video { width: 640px; height: 360px; background: #111; }
    </style>
  </head>
  <body>
    <video id="v" playsinline preload="auto">
      <track id="t" kind="subtitles" srclang="en" label="English" src="sample.vtt" default />
    </video>
    <script>
      // The extension reads textTracks itself; this only forces the track to
      // load without needing a real media file.
      const track = document.getElementById('t');
      setTimeout(() => {
        try { track.track.mode = 'hidden'; } catch (error) {}
      }, 200);
    </script>
  </body>
</html>
